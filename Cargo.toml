[package]
name = "rollit"
version = "4.0.2"
edition = "2021"

[profile.release]
lto = true

[dependencies]
once_cell = "1.21.4"
libadwaita-sys = "0.9.1"
log = "0.4.29"
pretty_env_logger = "0.5.0"
# random-number = "0.1.8"
fastrand = "2.4.1"
regex = "1.12.3"

[dependencies.gtk]
package = "gtk4"
version = "0.11.2"
features = ["gnome_50"]

[dependencies.gio]
package = "gio"
version = "0.22.5"
features = ["v2_88"]

[dependencies.adw]
package = "libadwaita"
version = "0.9.1"
features = ["v1_9"]

[dependencies.gettext-rs]
version = "0.7.7"
features = ["gettext-system"]
